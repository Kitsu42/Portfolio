<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em produção</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #111827, #312e81, #4c1d95);
      text-align: center;
    }

    .container {
      width: min(90%, 500px);
      padding: 45px 30px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: #d1d5db;
      font-size: 17px;
      line-height: 1.6;
    }

    .dots {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #a78bfa;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.7);
        opacity: 0.5;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="icon">🎮</div>

    <h1>Jogo em produção</h1>

    <p>Volte mais tarde. Estamos preparando tudo para você!</p>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

</body>
</html>
